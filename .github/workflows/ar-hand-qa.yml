name: AR hand integration QA
on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/entrypoint.test.cjs
      - ar-hand.html
      - assets/valves/**
      - valve-preview.html
      - js/valve-assets.js
      - tools/generate_valves.py
      - tests/valve-assets.test.cjs
      - js/ar-hand.js
      - js/gesture-control.js
      - js/piping-engine.js
      - js/hand-screen-map.js
      - js/hand-occlusion.js
      - js/hand-model-loader.js
      - tests/hand-model-loader.test.cjs
      - tests/hand-occlusion.test.cjs
      - js/tracking-gate.js
      - tests/hand-screen-map.test.cjs
      - tests/ar-hand.test.cjs
      - .github/workflows/ar-hand-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check js/valve-assets.js && node --check js/hand-occlusion.js && node --check js/hand-model-loader.js && node --check js/ar-hand.js && node --check js/gesture-control.js && node --check js/piping-engine.js && node --check js/hand-screen-map.js && node --check js/tracking-gate.js
      - name: World tracking and gesture integration contract
        run: node tests/ar-hand.test.cjs
      - name: Video-screen calibration and SLAM stability
        run: node tests/hand-screen-map.test.cjs
      - name: Pinned MediaPipe hand model loader and CDN fallback
        run: node tests/hand-model-loader.test.cjs
      - name: Hand mask geometry and camera composition checks
        run: node tests/hand-occlusion.test.cjs
      - name: Authored valve GLB geometry contracts
        run: node tests/valve-assets.test.cjs
      - name: Existing piping model regression
        run: node tests/piping.test.cjs
      - name: AR-first entrypoint and UI contract
        run: node tests/entrypoint.test.cjs
      - name: Existing gesture state regression
        run: node tests/gesture.test.cjs
