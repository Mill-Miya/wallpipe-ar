name: WallPipe browser GLB preview QA
on:
  push:
    branches: [main]
    paths:
      - 'pipe-preview.html'
      - 'js/pipe-assets.js'
      - 'js/pipe-layout.js'
      - 'js/piping-engine.js'
      - 'js/valve-assets.js'
      - 'js/valve-placement.js'
      - 'assets/pipes/**'
      - 'assets/valves/**'
      - 'tests/browser-preview.test.mjs'
      - '.github/workflows/browser-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Run local preview in real Chromium with WebGL
        run: |
          node tools/serve-preview.mjs > /tmp/wallpipe-server.log 2>&1 &
          sleep 2
          node tests/browser-preview.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-chromium-screenshot
          path: /tmp/wallpipe-factory-browser.png
          if-no-files-found: ignore
