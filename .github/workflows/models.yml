name: Generate 3D assets
on:
  push:
    branches: [main]
    paths:
      - tools/generate_models.py
      - .github/workflows/models.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry libraries
        run: python -m pip install "numpy>=1.26,<3" "trimesh>=4.0,<5"
      - name: Generate generic pipe models
        run: python tools/generate_models.py
      - name: Save generated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "Generate generic pipe models"
            git push
          fi
